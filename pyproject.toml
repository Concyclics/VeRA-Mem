[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-mem"
version = "0.1.0"
description = "Reproducible low-rank and external-memory experiments on frozen language models"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=4.51,<6", "huggingface-hub>=0.30", "numpy>=1.26", "safetensors>=0.4", "jinja2>=3.1"]

[project.optional-dependencies]
data = ["datasets>=3", "pyarrow>=15"]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
vera-mem = "vera_mem.vector_run:main"
vera-mem-baselines = "vera_mem.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
